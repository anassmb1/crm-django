{% extends "layout.html" %}

{% block head_title %}Borrar Cliente{% endblock %}
    
{% block page_content %}
    {% include '_includes/_messages.html' %}
    <div class="container">
    <h1>Borrar Cliente</h1>
    <form action="" method="post">
        {% csrf_token %}
        <p>¿Estás seguro que quieres eliminar {{ cliente.nombre }} {{ cliente.apellido }}?</p>
        <button class="btn btn-primary">Eliminar</button>
        <p><a href="{% url 'detalle_cliente' cliente.pk %}">Cancelar</a></p>
    </form>
    </div>
{% endblock %}
