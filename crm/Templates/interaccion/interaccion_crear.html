{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block head_title %}Nueva interacción{% endblock %}
    
{% block page_content %}
{% include '_includes/_messages.html' %}

<div class="container py-4">
    <h1 class="mb-4">Nueva interacción</h1>
    <div class="card">
        <div class="card-body">
            <form action="" method="post">
                {% csrf_token %}
                {{ form.fecha|as_crispy_field }}
                {{ form.notas|as_crispy_field }}
                <button class="btn btn-primary">Crear interacción</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
